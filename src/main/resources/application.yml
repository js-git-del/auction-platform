spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mariadb://localhost:3307/auction
    username: ${DB_USER}
    password: ${DB_PASSWORD}
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 3600000

server:
  servlet:
    encoding:
      charset: UTF-8
      force: true